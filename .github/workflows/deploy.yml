name: Build & Deploy SGTUFF Retail Tracker to WPX Subdomain

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mall-tenant-tracker/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Standalone Bundle
        run: npm run build:tracker

      - name: Deploy to WPX Subdomain via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./apps/mall-tenant-tracker/dist/
          server-dir: ./public_html/mall-tenant-tracker.sgtuff.org.sg/
          dangerous-clean-slate: false
